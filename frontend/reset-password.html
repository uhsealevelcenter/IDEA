<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDEA - Reset Password</title>
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%23041f26"/%3E%3Cpath d="M16 20h32v6H16zm0 9h20v6H16zm0 9h32v6H16z" fill="%2329d6d0"/%3E%3C/svg%3E'>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="login-page theme-light">
    <script>
        (function () {
            const THEME_STORAGE_KEY = 'idea-theme';
            const stored = localStorage.getItem(THEME_STORAGE_KEY) || 'system';
            const resolved = stored === 'system'
                ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : stored;
            document.body.classList.remove('theme-light', 'theme-dark');
            document.body.classList.add(`theme-${resolved}`);
            document.documentElement.style.colorScheme = resolved;
        })();
    </script>

    <div class="login-container">
        <div class="login-header">
            <h1>IDEA</h1>
            <p>Choose a new password</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    required
                    minlength="8"
                    maxlength="40"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    minlength="8"
                    maxlength="40"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="login-button" id="resetButton">
                Reset Password
            </button>
        </form>

        <div class="login-secondary-action">
            <a href="/login.html" id="loginLink">Back to sign in</a>
        </div>
    </div>

    <script src="assets/config.js"></script>
    <script>
        const form = document.getElementById('resetPasswordForm');
        const resetButton = document.getElementById('resetButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginLink = document.getElementById('loginLink');
        const LOGIN_MESSAGE_STORAGE_KEY = 'idea-login-message';

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function getPasswordResetConfirmEndpoint() {
            const endpoints = config.getEndpoints();
            if (endpoints.passwordResetConfirm) {
                return endpoints.passwordResetConfirm;
            }
            return endpoints.login.replace(/\/login\/?$/, '/password-reset/confirm');
        }

        function getLoginPageUrl() {
            const endpoints = config.getEndpoints();
            return endpoints.loginPage || '/login.html';
        }

        function getResetToken() {
            return new URLSearchParams(window.location.search).get('token') || '';
        }

        loginLink.href = getLoginPageUrl();

        const token = getResetToken();
        if (!token) {
            showError('This password reset link is missing a token. Please request a new reset link.');
            resetButton.disabled = true;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideMessages();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            if (newPassword.length < 8 || newPassword.length > 40) {
                showError('Password must be 8-40 characters.');
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = 'Resetting...';

            try {
                const response = await fetch(getPasswordResetConfirmEndpoint(), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token,
                        new_password: newPassword
                    })
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    localStorage.setItem(LOGIN_MESSAGE_STORAGE_KEY, JSON.stringify({
                        type: 'success',
                        message: data.message || 'Password updated successfully. Please sign in.'
                    }));
                    showSuccess('Password updated successfully. Redirecting to sign in...');
                    setTimeout(() => {
                        window.location.href = getLoginPageUrl();
                    }, 1200);
                } else {
                    showError(data.detail || 'Unable to reset your password. Please request a new reset link.');
                }
            } catch (error) {
                console.error('Password reset failed:', error);
                showError('Unable to reset your password. Please check your connection and try again.');
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
