<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDEA - Forgot Password</title>
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%23041f26"/%3E%3Cpath d="M16 20h32v6H16zm0 9h20v6H16zm0 9h32v6H16z" fill="%2329d6d0"/%3E%3C/svg%3E'>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page theme-light">
    <script>
        (function () {
            const THEME_STORAGE_KEY = 'idea-theme';
            const stored = localStorage.getItem(THEME_STORAGE_KEY) || 'system';
            const resolved = stored === 'system'
                ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : stored;
            document.body.classList.remove('theme-light', 'theme-dark');
            document.body.classList.add(`theme-${resolved}`);
            document.documentElement.style.colorScheme = resolved;
        })();
    </script>

    <div class="login-container">
        <div class="login-header">
            <h1>IDEA</h1>
            <p>Reset your password</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="login-button" id="resetButton">
                Send Reset Link
            </button>
        </form>

        <div class="login-secondary-action">
            <a href="login.html">Back to sign in</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const form = document.getElementById('forgotPasswordForm');
        const resetButton = document.getElementById('resetButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function getPasswordResetRequestEndpoint() {
            const endpoints = config.getEndpoints();
            if (endpoints.passwordResetRequest) {
                return endpoints.passwordResetRequest;
            }
            return endpoints.login.replace(/\/login\/?$/, '/password-reset/request');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError('Please enter your email address.');
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = 'Sending...';

            try {
                const response = await fetch(getPasswordResetRequestEndpoint(), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    showSuccess(data.message || 'If an account exists for that email, a password reset link has been sent.');
                } else {
                    showError(data.detail || 'Unable to request a password reset right now.');
                }
            } catch (error) {
                console.error('Password reset request failed:', error);
                showError('Unable to request a password reset. Please check your connection and try again.');
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
