map $http_upgrade $next_dev_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name next-dev.ideaxiom.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 308 https://next-dev.ideaxiom.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name next-dev.ideaxiom.org;

    ssl_certificate /etc/letsencrypt/live/next-dev.ideaxiom.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next-dev.ideaxiom.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    set $next_dev_n8n http://n8n-next-dev-gateway:8080;
    location ~ ^/(?:n8n|IDEA-portal|SEA-portal|portal-assets)(?:/|$) {
        proxy_pass $next_dev_n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $next_dev_connection;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    include /etc/nginx/snippets/locations.conf;
}


# n8n uses the Docker name `nginx` for its specialist credential. Present
# the browser-facing TLS origin to Open WebUI so the Pipe emits HTTPS exports.
server {
    listen 80;
    server_name nginx;

    location ^~ /api/ {
        proxy_pass $openwebui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host next-dev.ideaxiom.org;
        proxy_set_header X-Forwarded-Host next-dev.ideaxiom.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 660s;
    }

    include /etc/nginx/snippets/locations.conf;
}
