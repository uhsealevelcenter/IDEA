map $http_upgrade $upgrade_connection {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=next_dev_chat:10m rate=12r/m;

upstream n8n_app {
    zone n8n_app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server n8n-next-dev:5678 resolve;
}

upstream idea_gateway {
    zone idea_gateway 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server nginx:80 resolve;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $upgrade_connection;
    proxy_read_timeout 660s;
    proxy_buffering off;

    location = / { return 308 /n8n/; }
    location = /n8n { return 308 /n8n/; }
    location = /IDEA-portal { alias /usr/share/nginx/html/portal/index.html; default_type text/html; }
    location = /IDEA-portal/ { return 308 /IDEA-portal$is_args$args; }
    location = /SEA-portal { alias /usr/share/nginx/html/portal/index.html; default_type text/html; }
    location = /SEA-portal/ { return 308 /SEA-portal$is_args$args; }
    location = /n8n/SEA-portal { return 308 /SEA-portal$is_args$args; }
    location = /n8n/SEA-portal/ { return 308 /SEA-portal$is_args$args; }

    location ^~ /portal-assets/ {
        alias /usr/share/nginx/html/portal/;
    }

    location ^~ /integration-exports/ {
        proxy_pass http://idea_gateway;
    }

    location ~ ^/n8n/webhook/(?:892d894b-ff0d-4a86-a8c1-95468df23065|f311b56b-2b73-4ef4-9ae9-2cf80f8945e3)/chat$ {
        limit_req zone=next_dev_chat burst=6 nodelay;
        limit_req_status 429;
        rewrite ^/n8n(/.*)$ $1 break;
        proxy_pass http://n8n_app;
    }

    location /n8n/ {
        proxy_pass http://n8n_app/;
    }

    location / { return 404; }
}
