services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: idea-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - ./db/.env
    ports:
      - "${DB_HOST_PORT:-127.0.0.1:5434:5432}"

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: idea-redis
    restart: unless-stopped
    env_file:
      - ./redis/.env
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6380:6379}"
    volumes:
      - idea_redis_data:/data
    command: redis-server --appendonly yes

  langgraph:
    build:
      context: ./langgraph
      dockerfile: Dockerfile
    image: idea-langgraph
    container_name: idea_langgraph
    ports:
      - "${LANGGRAPH_HOST_PORT:-8010:8010}"
    env_file:
      - ./langgraph/.env
    volumes:
      - idea_paperqa_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      sandbox:
        condition: service_started
      litellm:
        condition: service_started

  sandbox:
    build:
      context: ./sandbox_service
      dockerfile: Dockerfile
    image: idea-sandbox
    container_name: idea_sandbox
    ports:
      - "${SANDBOX_HOST_PORT:-8020:8020}"
    env_file:
      - ./sandbox_service/.env
    volumes:
      - idea_microsandbox_data:/root/.microsandbox
      - idea_shared_data:/app/data:ro
      - idea_shared_data:/srv/idea_shared_data
    devices:
      - ${KVM_DEVICE_PATH:-/dev/null}:/dev/kvm

  shared-data:
    profiles: ["maintenance"]
    build:
      context: ./shared_data
      dockerfile: Dockerfile
    image: idea-shared-data
    volumes:
      - idea_shared_data:/app/data

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    image: idea-litellm
    container_name: idea_litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_HOST_PORT:-8030:8080}"
    env_file:
      - ./litellm/.env
    volumes:
      - ./litellm/litellm_config.yaml:/app/litellm_config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      langfuse:
        condition: service_started

  langfuse:
    build:
      context: ./langfuse
      dockerfile: Dockerfile
    image: idea-langfuse
    container_name: idea_langfuse
    restart: unless-stopped
    ports:
      - "${LANGFUSE_HOST_PORT:-3050:3000}"
    env_file:
      - ./langfuse/.env
    depends_on:
      db:
        condition: service_healthy

  openwebui:
    build:
      context: ./openwebui
      dockerfile: Dockerfile
    image: idea-openwebui:0.11.0-idea.0.9-open-sharing-fix
    container_name: idea_openwebui
    restart: unless-stopped
    ports:
      - "3001:8080"
    env_file:
      - ./openwebui/.env
    volumes:
      - idea_openwebui_data:/app/backend/data
      - ./openwebui/functions:/app/backend/data/functions/idea
    depends_on:
      - langgraph
      - redis

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: idea-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT_HTTP:-80}:80"
      - "${NGINX_PORT_HTTPS:-443}:443"
    env_file:
      - ./nginx/.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-locations.conf:/etc/nginx/snippets/locations.conf:ro
      - ./static:/static:ro
      - ${CERTBOT_CONF_DIR:-./certbot/conf}:/etc/letsencrypt:ro
      - ${CERTBOT_WWW_DIR:-./certbot/www}:/var/www/certbot:ro
      - ${NGINX_HTTPS_CONF:-/dev/null}:/etc/nginx/https.d/https.conf:ro
    depends_on:
      - openwebui

volumes:
  idea_persistent_data:
  idea_redis_data:
  app-db-data:
  idea_openwebui_data:
  idea_microsandbox_data:
  idea_shared_data:
  idea_paperqa_data:
