version: '3.8'

services:
  db:
    # Pinned by digest (was floating :pg17) - currently resolves to
    # PostgreSQL 17.10. Re-pin deliberately when you want to move forward.
    image: pgvector/pgvector@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  redis:
    # Pinned by digest (was floating :alpine) - currently resolves to
    # Redis 8.8.0. Re-pin deliberately when you want to move forward.
    image: redis@sha256:9eb6a7ba3d344e1958c7e1589fa3dee90373a934e8159c634562a91d622759a0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # so that we can have SEA and IDEA on the same machine; localhost-only so Redis isn't public (containers reach it over the docker network)
    volumes:
      - idea_redis_data:/data
    command: redis-server --appendonly yes

  langgraph:
    build:
      context: ./langgraph
      dockerfile: ./Dockerfile
    image: idea-langgraph
    container_name: idea_langgraph
    # No host ports: published (dev-only) via docker-compose.override.yml,
    # which production_start.sh's `-f docker-compose.yml -f
    # docker-compose.prod.yml` combo does NOT include - keeps this
    # unauthenticated-by-default internal API off the host in prod. See
    # INTERNAL_SERVICE_TOKEN below for the actual auth guard, which does
    # apply regardless of port exposure.
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # OPENAI_API_KEY / OPENAI_BASE_URL intentionally NOT re-declared here -
      # env_file above already injects them literally from .env. Re-declaring
      # them as ${OPENAI_API_KEY} would instead resolve from the host shell
      # environment (if exported there), silently shadowing the .env value.
      # Base URL of the stateful sandbox_service this service delegates all
      # terminal/sandbox execution to - see langgraph/tools/persistent_terminal.py.
      - SANDBOX_SERVICE_URL=${SANDBOX_SERVICE_URL:-http://sandbox:8020}
      # Used by TerminalAgent._sync_outputs_to_openwebui to push /outputs
      # files into Open WebUI's own Files storage at the end of each turn.
      # The Pipe forwards the current user's credential for correct file
      # ownership; uploads run concurrently within this whole-batch timeout.
      - OPENWEBUI_BASE_URL=${OPENWEBUI_BASE_URL:-http://openwebui:8080}
      - OUTPUT_SYNC_TIMEOUT_SECONDS=${OUTPUT_SYNC_TIMEOUT_SECONDS:-30}
      - OUTPUT_SYNC_MAX_WORKERS=${OUTPUT_SYNC_MAX_WORKERS:-4}
      # Skill content is never silently truncated. A skill above this limit
      # fails explicitly so an administrator can shorten or split it.
      - MAX_SKILL_BYTES=${MAX_SKILL_BYTES:-100000}
      # INTERNAL_SERVICE_TOKEN itself is NOT re-declared here for the same
      # reason OPENAI_API_KEY isn't above - env_file already injects it
      # literally from .env. Guards both this service's own routes
      # (langgraph_service.py) and its calls into sandbox below - see
      # require_internal_token in both services and example.env.
    depends_on:
      - redis
      - sandbox
      - litellm

  sandbox:
    build:
      context: ./sandbox_service
      dockerfile: ./Dockerfile
    image: idea-sandbox
    container_name: idea_sandbox
    # See the matching comment on `langgraph` above - no host ports here
    # either; dev-only exposure lives in docker-compose.override.yml.
    volumes:
      # Without this, ALL microsandbox state (its own internal SQLite
      # tracking db at /root/.microsandbox/db/msb.db, cached VM images, and
      # critically each sandbox's upper.ext4 disk overlay - i.e. every
      # user's actual files) lives only in this container's throwaway
      # writable layer and is wiped on every container recreate (e.g. a
      # rebuild) - see the official microsandbox docs' "Persistent data"
      # section. A plain container restart (no recreate) *should* survive
      # without this volume too, but pair this with a graceful shutdown
      # hook (stop active sandboxes before the container exits) since an
      # unclean SIGKILL mid-write can still leave upper.ext4 in a state
      # the runtime won't resume from.
      - idea_microsandbox_data:/root/.microsandbox
      # One administrator-managed scientific data tree, visible to the local
      # fallback shell read-only at /app/data. Microsandbox's VirtioFS setup
      # itself needs a writable host-side source, so the same volume is also
      # mounted at a service-only path; msb_sandbox.py makes that second path
      # read-only inside every guest VM. Updates are performed only by the
      # `shared-data` maintenance service below.
      - idea_shared_data:/app/data:ro
      - idea_shared_data:/srv/idea_shared_data
    devices:
      # Passes host KVM through so microsandbox (sandbox_service/msb_sandbox.py)
      # can boot per-user microVMs. Gated behind KVM_DEVICE_PATH (set to
      # /dev/kvm in .env only on hosts that actually have it, e.g. a
      # Jetstream2 VM) rather than hardcoding /dev/kvm here, because Compose
      # hard-fails at container start if the host path doesn't exist at all
      # (e.g. on a Mac). Defaults to /dev/null, which exists on every
      # Docker host - msb_sandbox.py's _kvm_functional() then correctly
      # detects that dummy device as non-functional (unlike a plain
      # os.path.exists() check) and falls back to the local backend.
      - ${KVM_DEVICE_PATH:-/dev/null}:/dev/kvm
    environment:
      - PYTHONUNBUFFERED=1
      # "auto" | "microsandbox" | "local" - see sandbox_service/terminal_registry.py
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-auto}
      # OCI image booted for each new microsandbox VM - see msb_sandbox.py.
      # Published build of interpreter_kernel/ (see that directory's
      # README for how it's built/pushed) - gives sandboxes the persistent
      # Python kernel (run_python_tool) and Open Terminal-backed
      # grep_search_tool/glob_search_tool. Override via .env (SANDBOX_IMAGE)
      # to pin a different tag/digest, or fall back to the bare "python"
      # image (only run_terminal_tool/write_file_tool) if needed.
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ghcr.io/uhsealevelcenter/idea-oi-kernel:slim}
      # Absolute path inside this service container which msb_sandbox.py
      # bind-mounts into every per-user VM at /app/data, read-only.
      - SHARED_DATA_HOST_PATH=/srv/idea_shared_data
      # Only needed if the ghcr.io package above is private - see
      # entrypoint.sh and interpreter_kernel/README.md's "Private registry
      # auth" section for how these configure microsandbox's own pull
      # credentials (a plain `docker login ghcr.io` doesn't cover this -
      # msb pulls images itself, independent of the Docker daemon). Leave
      # both unset if the package is public.
      - GHCR_USERNAME=${GHCR_USERNAME:-}
      - GHCR_PAT=${GHCR_PAT:-}
      # Idle sandboxes auto-drain (stop, not delete) after this many seconds
      # of inactivity; empty SANDBOX_MAX_DURATION_SECONDS disables the hard
      # lifetime cap. See sandbox_service/msb_sandbox.py.
      - SANDBOX_IDLE_TIMEOUT_SECONDS=${SANDBOX_IDLE_TIMEOUT_SECONDS:-1800}
      - SANDBOX_MAX_DURATION_SECONDS=${SANDBOX_MAX_DURATION_SECONDS:-}
      # Guards this service's HTTP API (main.py's require_internal_token) -
      # this service has no env_file, unlike langgraph/openwebui above, so
      # this must be listed explicitly to reach the container at all.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}

  # Administrative one-shot tool for seeding, validating, and updating the
  # data volume exposed read-only to user sandboxes. The profile prevents it
  # from becoming a long-running part of a normal `docker compose up`.
  shared-data:
    profiles: ["maintenance"]
    build:
      context: ./shared_data
      dockerfile: ./Dockerfile
    image: idea-shared-data
    volumes:
      - idea_shared_data:/app/data

  # LiteLLM proxy - fronts the same Azure AI Foundry OpenAI-compatible
  # endpoint langgraph/ already talks to directly. It exposes gpt-5.6-sol
  # to the IDEA agent and gpt-5.6-luna to Open WebUI for background tasks
  # (see litellm/litellm_config.yaml). Uses a dedicated Postgres
  # role+schema on the existing `db` service rather than its own database
  # container - see litellm/init_litellm_db.sql / setup_litellm_db.sh,
  # which must be run once (idempotent, safe to re-run) before this
  # service can start successfully.
  litellm:
    build:
      context: ./litellm
      dockerfile: ./Dockerfile
    image: idea-litellm
    container_name: idea_litellm
    restart: unless-stopped
    # No host ports here either - dev-only exposure lives in
    # docker-compose.override.yml, matching langgraph/sandbox above.
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Assembled here (not in .env) since env_file values are injected
      # literally, not variable-expanded - see example.env's LiteLLM
      # section and litellm/init_litellm_db.sql for how the `litellm`
      # role/schema this points at get created.
      - LITELLM_DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?schema=litellm
    volumes:
      # Lets the config be edited without rebuilding the image.
      - ./litellm/litellm_config.yaml:/app/litellm_config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Open WebUI frontend, talking to the existing langgraph service via the
  # Pipe function in ./openwebui/functions/idea_pipe.py. Replaces the old
  # static `frontend` at the root domain - see nginx.conf's `location /`
  # (dev-only routing lives in docker-compose.override.yml's nginx service).
  # `web`'s API routes (/api/, /idea-api/, /conversations/, /share/) are
  # untouched since other things may still depend on them.
  openwebui:
    # Pinned to an IDEA customization Git commit and image digest (was
    # previously floating :main - see the
    # architecture doc's "OpenWebUI upgrade compatibility" section for why
    # that's dangerous: upstream default-behavior changes, e.g. native
    # tool-calling becoming the v0.10.0 default, could otherwise reach this
    # deployment via a routine `docker compose pull`). Swap this exact
    # commit tag deliberately (and re-verify
    # openwebui/functions/idea_pipe.py still works) whenever moving forward.
    image: ghcr.io/uhsealevelcenter/idea-open-webui:git-2574322bafe2fe0cd8958d29258eb6a782af2b1a@sha256:41ce4ed8a14bba38f901b2c227823129db1b34a66bdb9bfe5265e4fdc861890b
    container_name: idea_openwebui
    restart: unless-stopped
    ports:
      - "3001:8080"
    env_file:
      - .env
    environment:
      - WEBUI_NAME=Open WebUI # Per license, Open WebUI NAME and LOGO must remain in their original, prominent locations throughout the application and user interface.
      - ENABLE_OLLAMA_API=false
      - LANGGRAPH_SERVICE_URL=http://langgraph:8010
      # Default (40) is a concurrency *ceiling* for blocking/sync ops, not
      # a thread/CPU count - too low for this deployment's usage (each
      # sandbox output file synced into Open WebUI via terminal_agent.py's
      # _sync_outputs_to_openwebui() competes with normal chat/API traffic
      # for the same pool). Symptoms when exhausted: requests appear to
      # "hang" for 10s-multiple minutes while CPU/RAM look fine - exactly
      # what caused the repeated "Read timed out" sync failures and
      # intermittent inability to reload a conversation. Raising this is
      # NOT a contention risk per Open WebUI's own docs - do not lower it.
      # We deliberately do NOT set UVICORN_WORKERS>1 here instead - this
      # deployment uses the default local SQLite-backed ChromaDB, and
      # multiple uvicorn workers fork()-sharing that same SQLite connection
      # crashes workers on concurrent document upload (see Open WebUI's
      # "Scaling & HA" troubleshooting doc, worker-crash section) - would
      # trade a slow failure mode for a hard one.
      - THREAD_POOL_SIZE=2000
      # Throttles last_active_at presence writes to once per user per this
      # many seconds instead of on every single request (the unset
      # default) - see the THREAD_POOL_SIZE comment above and Open WebUI's
      # own "Scaling & HA" troubleshooting doc ("Database Corruption /
      # Locked Errors" section) for why a flood of these tiny UPDATE/COMMIT
      # writes against the local SQLite file can hold up unrelated writes
      # (e.g. the file-sync POSTs from terminal_agent.py's
      # _sync_outputs_to_openwebui()) that happen to land in the same
      # window of active chat usage.
      - DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=60
    volumes:
      - idea_openwebui_data:/app/backend/data
      # NOTE: this does NOT auto-register the Pipe function - Open WebUI
      # Functions live in its own database and must be added once via
      # Admin Panel > Functions > "+" > paste the contents of
      # ./openwebui/functions/idea_pipe.py. This mount just keeps the
      # source file colocated in this repo for editing/reference.
      - ./openwebui/functions:/app/backend/data/functions/idea
    depends_on:
      - langgraph
      - redis

volumes:
  idea_persistent_data:
  idea_redis_data:
  app-db-data:
  idea_openwebui_data:
  idea_microsandbox_data:
  idea_shared_data:
