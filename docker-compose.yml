version: '3.8'

services:
  web:
    image: ghcr.io/uhsealevelcenter/idea:${IMAGE_TAG}
    container_name: idea_container
    restart: unless-stopped
    shm_size: "2gb" # increase shared memory size to prevent potential issues with large models or data processing
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "8002:8001" # so that we can have SEA and IDEA on the same machine
    env_file:
      - .env
    volumes:
      - idea_persistent_data:/app/data
      - ./.codex:/app/.codex # CODEX_HOME: for Codex CLI authentication, config, and agent working agreements
    environment:
      - PYTHONUNBUFFERED=1
      - LOCAL_DEV=0
      - PQA_HOME=/app/data
      - PROMPT_DIRECTORY=/app/data/prompts
      - CODEX_HOME=/app/.codex
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    depends_on:
      - redis
      - db

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # so that we can have SEA and IDEA on the same machine; localhost-only so Redis isn't public (containers reach it over the docker network)
    volumes:
      - idea_redis_data:/data
    command: redis-server --appendonly yes

  langgraph:
    build:
      context: ./langgraph
      dockerfile: ./Dockerfile
    image: idea-langgraph
    container_name: idea_langgraph
    # No host ports: published (dev-only) via docker-compose.override.yml,
    # which production_start.sh's `-f docker-compose.yml -f
    # docker-compose.prod.yml` combo does NOT include - keeps this
    # unauthenticated-by-default internal API off the host in prod. See
    # INTERNAL_SERVICE_TOKEN below for the actual auth guard, which does
    # apply regardless of port exposure.
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # OPENAI_API_KEY / OPENAI_BASE_URL intentionally NOT re-declared here -
      # env_file above already injects them literally from .env. Re-declaring
      # them as ${OPENAI_API_KEY} would instead resolve from the host shell
      # environment (if exported there), silently shadowing the .env value.
      # Base URL of the stateful sandbox_service this service delegates all
      # terminal/sandbox execution to - see langgraph/tools/persistent_terminal.py.
      - SANDBOX_SERVICE_URL=${SANDBOX_SERVICE_URL:-http://sandbox:8020}
      # Used by TerminalAgent._sync_outputs_to_openwebui to push /outputs
      # files into Open WebUI's own Files storage at the end of each turn.
      # OPENWEBUI_API_KEY is a static API key generated by an admin user in
      # Open WebUI (Settings > Account > API Keys) - leave unset to disable
      # syncing entirely (falls back to no-op).
      - OPENWEBUI_BASE_URL=${OPENWEBUI_BASE_URL:-http://openwebui:8080}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      # INTERNAL_SERVICE_TOKEN itself is NOT re-declared here for the same
      # reason OPENAI_API_KEY isn't above - env_file already injects it
      # literally from .env. Guards both this service's own routes
      # (langgraph_service.py) and its calls into sandbox below - see
      # require_internal_token in both services and example.env.
    depends_on:
      - redis
      - sandbox

  sandbox:
    build:
      context: ./sandbox_service
      dockerfile: ./Dockerfile
    image: idea-sandbox
    container_name: idea_sandbox
    # See the matching comment on `langgraph` above - no host ports here
    # either; dev-only exposure lives in docker-compose.override.yml.
    devices:
      # Passes host KVM through so microsandbox (sandbox_service/msb_sandbox.py)
      # can boot per-user microVMs. Gated behind KVM_DEVICE_PATH (set to
      # /dev/kvm in .env only on hosts that actually have it, e.g. a
      # Jetstream2 VM) rather than hardcoding /dev/kvm here, because Compose
      # hard-fails at container start if the host path doesn't exist at all
      # (e.g. on a Mac). Defaults to /dev/null, which exists on every
      # Docker host - msb_sandbox.py's _kvm_functional() then correctly
      # detects that dummy device as non-functional (unlike a plain
      # os.path.exists() check) and falls back to the local backend.
      - ${KVM_DEVICE_PATH:-/dev/null}:/dev/kvm
    environment:
      - PYTHONUNBUFFERED=1
      # "auto" | "microsandbox" | "local" - see sandbox_service/terminal_registry.py
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-auto}
      # OCI image booted for each new microsandbox VM - see msb_sandbox.py.
      # Set to a published build of interpreter_kernel/ (e.g.
      # idea/oi-kernel:slim) to give sandboxes the persistent Python kernel
      # (run_python_tool) and Open Terminal-backed grep_search_tool/
      # glob_search_tool; defaults to the bare "python" image, which only
      # supports run_terminal_tool/write_file_tool.
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python}
      # Idle sandboxes auto-drain (stop, not delete) after this many seconds
      # of inactivity; empty SANDBOX_MAX_DURATION_SECONDS disables the hard
      # lifetime cap. See sandbox_service/msb_sandbox.py.
      - SANDBOX_IDLE_TIMEOUT_SECONDS=${SANDBOX_IDLE_TIMEOUT_SECONDS:-1800}
      - SANDBOX_MAX_DURATION_SECONDS=${SANDBOX_MAX_DURATION_SECONDS:-}
      # Guards this service's HTTP API (main.py's require_internal_token) -
      # this service has no env_file, unlike langgraph/openwebui above, so
      # this must be listed explicitly to reach the container at all.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}

  # Open WebUI frontend, talking to the existing langgraph service via the
  # Pipe function in ./openwebui/functions/idea_pipe.py. Replaces the old
  # static `frontend` at the root domain - see nginx.conf's `location /`
  # (dev-only routing lives in docker-compose.override.yml's nginx service).
  # `web`'s API routes (/api/, /idea-api/, /conversations/, /share/) are
  # untouched since other things may still depend on them.
  openwebui:
    # TODO: pin to a specific released tag (e.g. ghcr.io/open-webui/
    # open-webui:v0.x.y) instead of the floating :main once you've picked
    # one to track - see the architecture doc's "OpenWebUI upgrade
    # compatibility" section for why (upstream default-behavior changes,
    # e.g. native tool-calling becoming the v0.10.0 default, shouldn't be
    # able to reach this deployment via a routine `docker compose pull`).
    image: ghcr.io/open-webui/open-webui:main
    container_name: idea_openwebui
    restart: unless-stopped
    ports:
      - "3001:8080"
    env_file:
      - .env
    environment:
      - WEBUI_NAME=IDEA
      - ENABLE_OLLAMA_API=false
      - LANGGRAPH_SERVICE_URL=http://langgraph:8010
    volumes:
      - idea_openwebui_data:/app/backend/data
      # NOTE: this does NOT auto-register the Pipe function - Open WebUI
      # Functions live in its own database and must be added once via
      # Admin Panel > Functions > "+" > paste the contents of
      # ./openwebui/functions/idea_pipe.py. This mount just keeps the
      # source file colocated in this repo for editing/reference.
      - ./openwebui/functions:/app/backend/data/functions/idea
    depends_on:
      - langgraph
      - redis

volumes:
  idea_persistent_data:
  idea_redis_data:
  app-db-data:
  idea_openwebui_data:
