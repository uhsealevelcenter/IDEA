services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: idea
    container_name: idea_container
    ports:
      - "8002:8001" # so that we can have SEA and IDEA on the same machine
    env_file:
      - .env
    volumes:
      - idea_persistent_data:/app/data
      - ./.codex:/app/.codex # CODEX_HOME: for Codex CLI authentication, config, and agent working agreements
      - ./.ssh:/app/.ssh:ro # HPC SSH keys directory (optional — place idea_hpc_key inside .ssh/)
    environment:
      - PYTHONUNBUFFERED=1
      - LOCAL_DEV=0
      - PQA_HOME=/app/data
      - PROMPT_DIRECTORY=/app/data/prompts
      - CODEX_HOME=/app/.codex
      - LITELLM_PROXY_URL=http://litellm:8080
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      - ./postgres/init-langfuse.sql:/docker-entrypoint-initdb.d/init-langfuse.sql:ro
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    image: idea-litellm
    container_name: litellm_container
    restart: always
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LITELLM_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse:3000

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      langfuse:
        condition: service_started

  redis:
    image: redis:alpine
    ports:
      - "6380:6379" # so that we can have SEA and IDEA on the same machine
    volumes:
      - idea_redis_data:/data
    command: redis-server --appendonly yes

  langfuse:
    image: langfuse/langfuse:2
    restart: always
    ports:
      - "8081:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8081}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-idea-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-IDEA}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-idea-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-IDEA}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/public/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  idea_persistent_data:
  idea_redis_data:
  app-db-data:
