version: '3.8'

# NOTE: superseded - the `sandbox.devices` /dev/kvm passthrough this file
# used to add now lives directly in the base docker-compose.yml, gated
# behind the KVM_DEVICE_PATH env var (defaults to the always-safe /dev/null,
# set to /dev/kvm in .env only on hosts that actually have it). That base
# file is included by both local_start.sh and the actual CI deploy path
# (DEPLOY_CMD), so a separate -f docker-compose.prod.yml overlay is no
# longer necessary for that; set KVM_DEVICE_PATH=/dev/kvm in that host's
# .env instead - see docker-compose.yml's `sandbox.devices` comment for
# details.

services:
  sandbox:
    # Per-microVM production defaults for the current 8-CPU, 30-GB RAM,
    # 250-GB disk hosts. Explicit .env values can still override them.
    environment:
      - SANDBOX_CPUS=${SANDBOX_CPUS:-2}
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-4096}
      - SANDBOX_DISK_MB=${SANDBOX_DISK_MB:-10240}

  nginx:
    # Pinned by digest (was floating :alpine).
    image: nginx@sha256:1a8724a52d432501548a8d8681bb1554c2d09778f8b9ed0882fc3442549980b7
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # uncomment once prod has a real domain + cert
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-locations.conf:/etc/nginx/snippets/locations.conf:ro
      - ./static:/static:ro
      # - ./certbot/conf:/etc/letsencrypt:ro   # cert storage, once TLS is set up
      # - ./certbot/www:/var/www/certbot:ro    # certbot's renewal challenge path
      # - ./nginx-https-prod.conf:/etc/nginx/https.d/https.conf:ro   # TODO uncomment once nginx-https-prod.conf has a real domain + cert paths filled in
    depends_on:
      - openwebui
