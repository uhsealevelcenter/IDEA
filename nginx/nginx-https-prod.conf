# Prod-only HTTPS server block. Mount target: /etc/nginx/https.d/https.conf

# Certificate renewal is handled by deployment/renew-production-cert.sh.

server {
    listen 443 ssl;
    server_name app.ideaxiom.org;

    ssl_certificate     /etc/letsencrypt/live/app.ideaxiom.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ideaxiom.org/privkey.pem;

    include /etc/nginx/snippets/locations.conf;
}

# Separate hostname and certificate; keep IDEA routing above unchanged.
server {
    listen 80;
    server_name langfuse.ideaxiom.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://langfuse.ideaxiom.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name langfuse.ideaxiom.org;

    ssl_certificate     /etc/letsencrypt/live/langfuse.ideaxiom.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langfuse.ideaxiom.org/privkey.pem;

    # Variable proxy_pass uses the Docker resolver in nginx.conf after recreation.
    set $langfuse_upstream http://idea_langfuse:3000;
    location / {
        proxy_pass $langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
