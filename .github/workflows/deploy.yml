name: Deploy

on:
  push:
    branches: [dev, staging, prod, next-dev]
  # Manual trigger for redeploys / rollbacks without a new commit.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to deploy (defaults to the selected branch's tip)"
        required: false
        type: string

# Never runs two deploys against the same environment simultaneously.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Maps the triggering branch -> GitHub Environment name.
  select:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)      echo "environment=dev"      >> "$GITHUB_OUTPUT" ;;
            staging)  echo "environment=staging"  >> "$GITHUB_OUTPUT" ;;
            prod)     echo "environment=prod"     >> "$GITHUB_OUTPUT" ;;
            next-dev) echo "environment=next-dev" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Branch '${GITHUB_REF_NAME}' is not mapped to an environment."
              exit 1
              ;;
          esac

  # Reads the per-environment DEPLOY_ENABLED variable inside a step and re-exposes it as a job output.
  gate:
    needs: select
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.environment }}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ vars.DEPLOY_ENABLED }}" >> "$GITHUB_OUTPUT"

  # Builds the Docker image and pushes it to ghcr.io.
  build:
    needs: [select, gate]
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.environment }}
    if: needs.gate.outputs.enabled == 'true'
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/uhsealevelcenter/idea
          tags: |
            # priority=1000 makes the immutable short-SHA the tag so deploys/rollbacks pin an exact commit
            type=sha,prefix=,format=short,priority=1000
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: idea
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

  deploy:
    needs: [select, gate, build]
    runs-on: ubuntu-latest
    # Binds job to the per-VM secrets GitHub Environment and applies any environment protection rules.
    environment: ${{ needs.select.outputs.environment }}
    # Only runs for environments that have DEPLOY_ENABLED=true (set in the GitHub Environment's vars).
    if: needs.gate.outputs.enabled == 'true'
    permissions:
      contents: read
      packages: read  # lets the run-scoped GITHUB_TOKEN pull the (private) image from ghcr.io
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Private deploy key (per-environment secret).
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          # Public host key (per-environment secret).
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -p "${{ vars.VM_SSH_PORT || '22' }}" \
              "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR="${{ vars.APP_DIR }}"
            DEPLOY_REF="${{ env.DEPLOY_REF }}"
            IMAGE_TAG="${{ env.IMAGE_TAG }}"
            DEPLOY_CMD="${{ vars.DEPLOY_CMD }}"
            cd "${APP_DIR}"

            # Per-environment deploy command (GitHub var DEPLOY_CMD). 
            if [ -z "${DEPLOY_CMD}" ]; then
              echo "::error::DEPLOY_CMD is not set for this environment."; exit 1
            fi

            echo "==> Fetching ${DEPLOY_REF}"
            git fetch --prune origin

            # Sync the checkout to what was pushed. 
            git checkout -f "${DEPLOY_REF}" 2>/dev/null || true
            git reset --hard "origin/${DEPLOY_REF}" 2>/dev/null || git reset --hard "${DEPLOY_REF}"

            echo "==> Deployed commit:"
            git --no-pager log -1 --oneline

            echo "==> Logging in to ghcr.io (ephemeral, run-scoped token) to pull the private image(s)"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Pulling image tag ${IMAGE_TAG}"
            IMAGE_TAG="${IMAGE_TAG}" docker compose pull web

            echo "==> Running: ${DEPLOY_CMD}"
            # Login stays active through DEPLOY_CMD (not just the `web` pull
            # above) - DEPLOY_CMD's own `docker compose up` also needs to
            # pull other private ghcr.io images (e.g. `openwebui` -
            # ghcr.io/uhsealevelcenter/idea-open-webui). Logging out before
            # this ran used to break that pull with "unauthorized".
            IMAGE_TAG="${IMAGE_TAG}" bash -c "${DEPLOY_CMD}"

            # Remove the credential from the VM now that all pulls are done;
            # the token also expires when the run ends regardless.
            docker logout ghcr.io
          REMOTE

      - name: Smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 3); do
            response=$(curl -fsS "http://${{ vars.VM_HOST }}/idea-api/health" 2>/dev/null) || { echo "Waiting for app to come up ($i/3)..."; sleep 30; continue; }
            if echo "${response}" | grep -q '"${{ github.sha }}"'; then
              echo "Healthy. SHA verified: ${{ github.sha }}"; exit 0
            fi
            echo "App responded but SHA mismatch. Response: ${response}"; sleep 30
          done
          echo "::error::Health check failed after deploy."; exit 1