name: Deploy

on:
  push:
    branches: [dev, staging, next-dev, main]
  # Manual trigger for redeploys / rollbacks without a new commit.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to deploy (defaults to the selected branch's tip)"
        required: false
        type: string

# Never runs two deploys against the same environment simultaneously.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Maps the triggering branch -> GitHub Environment name.
  select:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)      echo "environment=dev"      >> "$GITHUB_OUTPUT" ;;
            staging)  echo "environment=staging"  >> "$GITHUB_OUTPUT" ;;
            next-dev) echo "environment=next-dev" >> "$GITHUB_OUTPUT" ;;
            main)     echo "environment=prod"     >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Branch '${GITHUB_REF_NAME}' is not mapped to an environment."
              exit 1
              ;;
          esac

  # Reads the per-environment DEPLOY_ENABLED variable inside a step and re-exposes it as a job output.
  gate:
    needs: select
    runs-on: ubuntu-latest
    environment: ${{ needs.select.outputs.environment }}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ vars.DEPLOY_ENABLED }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [select, gate]
    runs-on: ubuntu-latest
    # Binds job to the per-VM secrets GitHub Environment and applies any environment protection rules.
    environment: ${{ needs.select.outputs.environment }}
    # Only runs for environments that have DEPLOY_ENABLED=true (set in the GitHub Environment's vars).
    if: needs.gate.outputs.enabled == 'true'
    permissions:
      contents: read
      packages: read  # lets the run-scoped GITHUB_TOKEN pull private images (e.g. openwebui)
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
      DEPLOY_ENV: ${{ needs.select.outputs.environment }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Private deploy key (per-environment secret).
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          # Public host key (per-environment secret).
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -p "${{ vars.VM_SSH_PORT || '22' }}" \
              "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR="${{ vars.APP_DIR }}"
            DEPLOY_REF="${{ env.DEPLOY_REF }}"
            DEPLOY_ENV="${{ env.DEPLOY_ENV }}"
            cd "${APP_DIR}"

            echo "==> Fetching ${DEPLOY_REF}"
            git fetch --prune origin

            # Sync the checkout to what was pushed. 
            git checkout -f "${DEPLOY_REF}" 2>/dev/null || true
            git reset --hard "origin/${DEPLOY_REF}" 2>/dev/null || git reset --hard "${DEPLOY_REF}"

            echo "==> Deployed commit:"
            git --no-pager log -1 --oneline

            echo "==> Logging in to ghcr.io (ephemeral, run-scoped token) to pull private image(s) (e.g. openwebui)"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Running deployment script for environment: ${DEPLOY_ENV}"
            ./deployment/deploy.sh "${DEPLOY_ENV}"

            echo "==> Waiting for LangGraph to become healthy"
            langgraph_ready=false
            for attempt in $(seq 1 12); do
              if docker compose exec -T langgraph \
                   curl -fsS http://localhost:8010/health >/dev/null 2>&1; then
                langgraph_ready=true
                break
              fi

              echo "LangGraph is not ready yet (${attempt}/12)"
              sleep 5
            done

            if [ "${langgraph_ready}" != "true" ]; then
              echo "::error::LangGraph failed its internal health check."
              docker compose ps -a langgraph
              docker compose logs --tail=200 --timestamps langgraph
              exit 1
            fi

            echo "LangGraph internal health check passed."

            # Remove the credential from the VM now that all pulls are done;
            # the token also expires when the run ends regardless.
            docker logout ghcr.io

            # Compose builds service images locally in this deployment. Remove
            # dangling layers left by replaced builds without touching tagged
            # images that may still be needed by other services or sandboxes.
            echo "==> Pruning dangling images from Compose rebuilds"
            docker image prune -f || true

            # Keep BuildKit's cache useful while preventing unbounded VM disk
            # growth between deployments.
            echo "==> Capping Docker build cache at 20GB"
            docker builder prune -f -a --keep-storage=20GB || true
          REMOTE

      - name: Smoke check
        env:
          HEALTHCHECK_URL: ${{ needs.select.outputs.environment == 'prod' && 'https://app.ideaxiom.org/' || vars.HEALTHCHECK_URL || format('http://{0}/', vars.VM_HOST) }}
        run: |
          set -euo pipefail
          for i in $(seq 1 3); do
            status=$(curl --connect-timeout 5 --max-time 15 -o /dev/null -sS -w "%{http_code}" "$HEALTHCHECK_URL" 2>/dev/null) || status=""
            if [ "${status}" = "200" ]; then
              echo "Healthy: nginx/openwebui responded 200."; exit 0
            fi
            echo "Waiting for app to come up ($i/3), got status '${status}'..."; sleep 30
          done
          echo "::error::Health check failed after deploy."; exit 1
