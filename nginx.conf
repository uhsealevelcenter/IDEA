events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 30M;  # Add here for global settings

    upstream backend {
        server web:8001;
    }

    upstream frontend {
        server frontend:8000;
    }

    # Open WebUI now serves the root domain - see docker-compose.yml's
    # openwebui service. Old `frontend` upstream above is kept only because
    # other locations below don't reference it; the frontend/ static files
    # are no longer routed to from anywhere.
    upstream openwebui {
        server openwebui:8080;
    }

    server {
        listen 80;
        server_name localhost 0.0.0.0;

        # Shared conversations - route to backend
        location /share/ {
            proxy_pass http://backend/share/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Open WebUI - replaces the old static frontend entirely.
        location / {
            proxy_pass http://openwebui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Open WebUI uses both WebSockets and SSE for streaming chat -
            # same requirements as the /api/ and /idea-api/ blocks below.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location ^~ /static/ {
            proxy_pass http://backend/idea-api/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API for conversations (used by share.js)
        location /conversations/ {
            client_max_body_size 30M;
            proxy_pass http://backend/conversations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api/ {
            client_max_body_size 30M;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Disable buffering for EventSource
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        # Backend API under /idea-api (FastAPI root_path)
        location ^~ /idea-api/ {
            client_max_body_size 30M;
            # Preserve the /idea-api prefix (note the trailing /idea-api/ here)
            proxy_pass http://backend/idea-api/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        # # Backend API for /sea-api (new Download Conversation API, under development)
        # location /sea-api/ {
        #     client_max_body_size 30M;
        #     proxy_pass http://backend/sea-api/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     # WebSocket support
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";

        #     # Disable buffering for EventSource (streaming)
        #     proxy_buffering off;
        #     proxy_cache off;
        #     proxy_set_header Connection '';
        #     chunked_transfer_encoding off;
        # }
    }
}