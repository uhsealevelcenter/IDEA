events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 30M;  # Add here for global settings

    # Docker's embedded DNS server - used below (via `resolver` + variables
    # in proxy_pass) so nginx re-resolves backend/openwebui hostnames on
    # every request instead of caching the IP for the life of the worker
    # process. Without this, any time an upstream container is recreated
    # (new IP from Docker's DNS - e.g. `docker compose up --force-recreate`,
    # a routine image pull/restart, etc.) nginx keeps retrying the stale IP
    # and returns 502s until nginx itself is restarted/reloaded. `upstream {}`
    # blocks (the previous approach here) resolve once at startup and never
    # refresh, which is what caused that exact failure mode.
    resolver 127.0.0.11 valid=10s;

    # Prod-only HTTPS block, mounted here by docker-compose.prod.yml; does nothing on dev/staging.
    include /etc/nginx/https.d/*.conf;

    server {
        listen 80;
        server_name localhost 0.0.0.0;

        set $openwebui_upstream http://openwebui:8080;

        # Authenticated, inline rendering for IDEA-generated output files.
        # Open WebUI's normal /content route forces most types (including
        # PNG and HTML) to download. This same-origin proxy keeps Open
        # WebUI's authorization check, but changes only the response
        # disposition. The CSP gives generated HTML an opaque origin while
        # still allowing scripts used by interactive plots.
        location ~ ^/idea-file-preview/([^/]+)(?:/.*)?$ {
            rewrite ^/idea-file-preview/([^/]+)(?:/.*)?$ /api/v1/files/$1/content break;
            proxy_pass $openwebui_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Content-Disposition;
            add_header Content-Disposition "inline" always;
            add_header Content-Security-Policy "sandbox allow-scripts allow-downloads allow-modals allow-popups" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Certbot's domain-verification file.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/snippets/locations.conf;
    }
}
